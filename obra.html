<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Flower's Nenascan 🌸 - Detalhes da Obra</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #netlify-badge, div[id*="netlify-badge"] { display: none !important; }
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #14141a;
            --primary-pink: #FF99DD; 
            --neon-glow: 0 0 12px rgba(255, 153, 221, 0.7), 0 0 25px rgba(255, 153, 221, 0.35);
            --text-main: #FF99DD;
            --text-muted: #e69ac5;
            --shadow: 0 4px 22px rgba(0, 0, 0, 0.7);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }
        p, span, a, h1, h2, h3, h4, div, button { color: var(--primary-pink); text-shadow: var(--neon-glow); }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background-color: rgba(11, 11, 14, 0.96); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255, 153, 221, 0.3); }
        .logo-img-container { display: flex; align-items: center; cursor: pointer; text-decoration: none; }
        .icon-btn { background: #181822; border: 1px solid rgba(255, 153, 221, 0.5); color: var(--primary-pink); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 1.3rem; text-shadow: var(--neon-glow); }
        .icon-btn svg { width: 22px; height: 22px; fill: currentColor; filter: drop-shadow(0 0 6px rgba(255, 153, 221, 0.7)); }
        .icon-btn:hover { background: var(--primary-pink); color: #0b0b0e; box-shadow: 0 0 15px var(--primary-pink); }
        .obra-container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .obra-banner-info { display: flex; flex-direction: column; gap: 20px; background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 153, 221, 0.3); box-shadow: var(--shadow); }
        @media(min-width: 600px) { .obra-banner-info { flex-direction: row; align-items: flex-start; } }
        .obra-capa-large { width: 180px; height: 260px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255, 153, 221, 0.5); box-shadow: var(--neon-glow); flex-shrink: 0; margin: 0 auto; }
        .obra-detalhes-texto { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .obra-titulo-principal { font-size: 1.5rem; font-weight: 800; color: var(--primary-pink); text-shadow: var(--neon-glow); }
        .obra-infos-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
        .obra-sinopse-box { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; background: #0f0f14; padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 153, 221, 0.15); max-height: 120px; overflow-y: auto; }
        .acoes-obra { display: flex; gap: 10px; margin-top: 5px; }
        .btn-acao { background: #181822; border: 1px solid var(--primary-pink); color: var(--primary-pink); padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; text-shadow: var(--neon-glow); display: flex; align-items: center; gap: 6px; font-size: 0.85rem; text-decoration: none; }
        .btn-acao:hover { background: var(--primary-pink); color: #0b0b0e; box-shadow: 0 0 12px var(--primary-pink); }
        .secao-capitulos { margin-top: 25px; background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid rgba(255, 153, 221, 0.3); box-shadow: var(--shadow); }
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .section-bar { width: 4px; height: 20px; background: var(--primary-pink); border-radius: 2px; box-shadow: var(--neon-glow); }
        .section-title { font-size: 1.15rem; font-weight: 800; color: var(--primary-pink); text-shadow: var(--neon-glow); }
        .lista-capitulos { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .capitulo-item { background: #121219; border: 1px solid rgba(255, 153, 221, 0.2); padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; transition: 0.2s; }
        .capitulo-item:hover { background: rgba(255, 153, 221, 0.1); border-color: var(--primary-pink); transform: translateX(4px); }
        .capitulo-numero { font-weight: 700; font-size: 0.95rem; color: var(--primary-pink); text-shadow: var(--neon-glow); }
        .capitulo-data { font-size: 0.78rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-img-container">
            <span style="font-size:1.15rem; font-weight:800; color:var(--primary-pink);">flower's nenasscan 🌸</span>
        </a>
        <a href="index.html" class="icon-btn" title="Voltar ao Início">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
    </header>

    <div class="obra-container">
        <div id="detalhes-conteudo">
            <p style="text-align: center; color: var(--text-muted);">Carregando informações da obra...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slugUrl = decodeURIComponent(urlParams.get('nome') || '').trim().toLowerCase();

        function criarSlug(texto) {
            return String(texto).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^\w-]/g, '');
        }

        fetch('obras.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(obras => {
                const obra = obras.find(o => criarSlug(o.titulo) === slugUrl || String(o.id).trim().toLowerCase() === slugUrl || String(o.titulo).trim().toLowerCase() === slugUrl);
                const container = document.getElementById('detalhes-conteudo');

                if (!obra) {
                    container.innerHTML = `
                        <div style="text-align:center; padding: 40px;">
                            <h2 style="color:var(--primary-pink);">Obra não encontrada!</h2>
                            <p style="color:var(--text-muted); margin-top: 10px;">O identificador informado na URL não confere com nenhuma obra cadastrada.</p>
                            <a href="index.html" class="btn-acao" style="display:inline-flex; margin-top:20px;">Voltar ao Início</a>
                        </div>
                    `;
                    return;
                }

                document.title = `${obra.titulo} - Flower's Nenascan 🌸`;

                let listaCapsHtml = '';
                if (obra.capitulos && obra.capitulos.length > 0) {
                    obra.capitulos.forEach(cap => {
                        let numCap = typeof cap === 'object' ? cap.numero : cap;
                        let dataCap = typeof cap === 'object' && cap.data ? cap.data : '';
                        let slugCap = String(numCap).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                        
                        listaCapsHtml += `
                            <a href="ler.html?obra=${obra.id || criarSlug(obra.titulo)}&cap=${slugCap}" class="capitulo-item">
                                <span class="capitulo-numero">${numCap}</span>
                                <span class="capitulo-data">${dataCap}</span>
                            </a>
                        `;
                    });
                } else {
                    listaCapsHtml = `<p style="color: var(--text-muted); text-align: center; padding: 20px;">Nenhum capítulo lançado ainda.</p>`;
                }

                let primeiroCapLink = '#';
                if (obra.capitulos && obra.capitulos.length > 0) {
                    let primeiro = obra.capitulos[obra.capitulos.length - 1]; 
                    let numPrimeiro = typeof primeiro === 'object' ? primeiro.numero : primeiro;
                    let slugPrimeiro = String(numPrimeiro).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                    primeiroCapLink = `ler.html?obra=${obra.id || criarSlug(obra.titulo)}&cap=${slugPrimeiro}`;
                }

                container.innerHTML = `
                    <div class="obra-banner-info">
                        <img src="${obra.capa}" alt="${obra.titulo}" class="obra-capa-large">
                        <div class="obra-detalhes-texto">
                            <h1 class="obra-titulo-principal">${obra.titulo}</h1>
                            <div class="obra-infos-meta">
                                <span><b>Autor(a):</b> ${obra.autor || 'Desconhecido'}</span>
                                <span><b>Artista:</b> ${obra.artista || 'Desconhecido'}</span>
                                <span><b>Status:</b> ${obra.status || 'Em Lançamento'}</span>
                            </div>
                            <div class="obra-sinopse-box">
                                ${obra.sinopse || 'Nenhuma sinopse cadastrada.'}
                            </div>
                            <div class="acoes-obra">
                                <a href="${primeiroCapLink}" class="btn-acao">Ler do Começo</a>
                                <button class="btn-acao" id="btn-favorito" onclick="toggleFavorito('${obra.titulo}')">Salvar Favorito</button>
                            </div>
                        </div>
                    </div>

                    <div class="secao-capitulos">
                        <div class="section-header">
                            <div class="section-bar"></div>
                            <h2 class="section-title">LISTA DE CAPÍTULOS</h2>
                        </div>
                        <div class="lista-capitulos">
                            ${listaCapsHtml}
                        </div>
                    </div>
                `;

                atualizarTextoBotaoFavorito(obra.titulo);
            })
            .catch(err => {
                console.error("Erro ao carregar detalhes:", err);
                document.getElementById('detalhes-conteudo').innerHTML = `<p style="color:red; text-align:center;">Erro ao carregar os dados da obra.</p>`;
            });

        function toggleFavorito(obraTitulo) {
            let favoritos = [];
            try { favoritos = JSON.parse(localStorage.getItem('flowers_favoritos')) || []; } catch(e) { favoritos = []; }

            const index = favoritos.indexOf(obraTitulo);
            if (index > -1) {
                favoritos.splice(index, 1);
            } else {
                favoritos.push(obraTitulo);
            }

            localStorage.setItem('flowers_favoritos', JSON.stringify(favoritos));
            atualizarTextoBotaoFavorito(obraTitulo);
        }

        function atualizarTextoBotaoFavorito(obraTitulo) {
            let favoritos = [];
            try { favoritos = JSON.parse(localStorage.getItem('flowers_favoritos')) || []; } catch(e) { favoritos = []; }

            const btn = document.getElementById('btn-favorito');
            if (btn) {
                if (favoritos.includes(obraTitulo)) {
                    btn.textContent = 'Remover Favorito';
                } else {
                    btn.textContent = 'Salvar Favorito';
                }
            }
        }
    </script>
</body>
</html>
