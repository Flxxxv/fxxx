<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - Flower's Nenasscan</title>
    <style>
        body { background: #111; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .leitor-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        .leitor-container img { width: 100%; height: auto; display: block; margin: 0; padding: 0; }
        .voltar { position: fixed; top: 10px; left: 10px; background: #ff69b4; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; z-index: 100; }
        .erro { margin-top: 100px; text-align: center; color: #ffb6c1; padding: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="voltar">← Voltar</a>
    <div class="leitor-container" id="painel-imagens"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const obraId = urlParams.get('obra');
        const capNum = urlParams.get('cap');
        const container = document.getElementById('painel-imagens');

        async function carregarLeitor() {
            if (!obraId || !capNum) {
                container.innerHTML = '<h2 class="erro">Erro: Obra ou capítulo não encontrados.</h2>';
                return;
            }

            try {
                const resposta = await fetch('obras.json');
                const obras = await resposta.json();

                const obra = obras.find(o => o.id === obraId);
                if (!obra) {
                    container.innerHTML = '<h2 class="erro">Obra não encontrada!</h2>';
                    return;
                }

                // Acha o capítulo correspondente no JSON (suporta tanto "paginas" quanto "link" ou arrays diretos)
                const capitulo = obra.capitulos.find(c => c.numero && c.numero.includes(capNum));
                
                if (!capitulo) {
                    container.innerHTML = '<h2 class="erro">Capítulo não encontrado no sistema!</h2>';
                    return;
                }

                // Pega a lista de imagens (seja em .paginas ou .link)
                const listaImagens = capitulo.paginas || capitulo.link;

                if (!listaImagens || (Array.isArray(listaImagens) && listaImagens.length === 0)) {
                    container.innerHTML = '<h2 class="erro">Este capítulo ainda não possui páginas cadastradas!</h2>';
                    return;
                }

                container.innerHTML = '';

                // Se for uma lista de links do Catbox, exibe todos um abaixo do outro
                if (Array.isArray(listaImagens)) {
                    listaImagens.forEach((urlImg, index) => {
                        let img = document.createElement('img');
                        img.src = urlImg;
                        img.alt = `Página ${index + 1}`;
                        container.appendChild(img);
                    });
                } else if (typeof listaImagens === 'string') {
                    // Caso seja um link único
                    let img = document.createElement('img');
                    img.src = listaImagens;
                    container.appendChild(img);
                }

            } catch (erro) {
                console.error(erro);
                container.innerHTML = '<h2 class="erro">Erro ao carregar os dados do capítulo.</h2>';
            }
        }

        carregarLeitor();
    </script>
</body>
</html>
