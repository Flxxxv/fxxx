   <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - Flower's Nenasscan</title>
    <style>
        body { background: #111; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .leitor-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        .leitor-container img { width: 100%; height: auto; display: block; margin: 0; padding: 0; }
        .voltar { position: fixed; top: 10px; left: 10px; background: #FF99DD; color: #0b0b0e; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; z-index: 100; box-shadow: 0 0 10px rgba(255,153,221,0.7); }
        .erro { margin-top: 100px; text-align: center; color: #FF99DD; padding: 20px; text-shadow: 0 0 10px rgba(255,153,221,0.7); }
    </style>
</head>
<body>
    <a href="index.html" class="voltar">← Voltar</a>
    <div class="leitor-container" id="painel-imagens"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const obraIdUrl = decodeURIComponent(urlParams.get('obra') || '').trim().toLowerCase();
        const capParamUrl = decodeURIComponent(urlParams.get('cap') || '').trim().toLowerCase();
        const container = document.getElementById('painel-imagens');

        async function carregarLeitor() {
            if (!obraIdUrl || !capParamUrl) {
                container.innerHTML = '<h2 class="erro">Erro: Obra ou capítulo não encontrados na URL.</h2>';
                return;
            }

            try {
                const resposta = await fetch('obras.json?v=' + new Date().getTime());
                const obras = await resposta.json();

                const obra = obras.find(o => String(o.id).trim().toLowerCase() === obraIdUrl);
                if (!obra) {
                    container.innerHTML = '<h2 class="erro">Obra não encontrada no sistema!</h2>';
                    return;
                }

                if (!obra.capitulos || obra.capitulos.length === 0) {
                    container.innerHTML = '<h2 class="erro">Esta obra não possui capítulos cadastrados.</h2>';
                    return;
                }

                const capitulo = obra.capitulos.find(c => {
                    const numBruto = typeof c === 'object' ? String(c.numero) : String(c);
                    const slugCadastrado = numBruto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                    return slugCadastrado === capParamUrl || numBruto.toLowerCase() === capParamUrl;
                });
                
                if (!capitulo) {
                    container.innerHTML = `<h2 class="erro">Capítulo não encontrado!</h2>`;
                    return;
                }

                const dadosLink = capitulo.link || capitulo.paginas || capitulo.pages;
                if (!dadosLink) {
                    container.innerHTML = '<h2 class="erro">Este capítulo ainda não possui páginas cadastradas no JSON!</h2>';
                    return;
                }

                container.innerHTML = '';

                if (Array.isArray(dadosLink)) {
                    dadosLink.forEach((urlImg, index) => {
                        let img = document.createElement('img');
                        img.src = urlImg;
                        img.alt = `Página ${index + 1}`;
                        container.appendChild(img);
                    });
                } else if (typeof dadosLink === 'string') {
                    let img = document.createElement('img');
                    img.src = dadosLink;
                    img.alt = "Página do Capítulo";
                    container.appendChild(img);
                }

            } catch (erro) {
                console.error(erro);
                container.innerHTML = '<h2 class="erro">Erro ao carregar os dados do capítulo.</h2>';
            }
        }

        carregarLeitor();
    </script>
</body>
</html>
