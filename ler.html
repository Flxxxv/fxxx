<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Flower's Nenascan 🌸 - Leitor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #netlify-badge, div[id*="netlify-badge"] { display: none !important; }
        :root {
            --bg-color: #000000;
            --primary-pink: #FF99DD; 
            --pink-glow: rgba(255, 153, 221, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--primary-pink); padding-bottom: 40px; overflow-x: hidden; }

        /* BARRA DE PROGRESSO MAIS FINA */
        .barra-progresso-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 153, 221, 0.15);
            z-index: 1000;
        }
        .barra-progresso-fill {
            width: 0%;
            height: 100%;
            background: #FF99DD;
            box-shadow: 0 0 8px #FF99DD;
            transition: width 0.1s linear;
        }

        /* TOPO DO LEITOR */
        .leitor-topo {
            background-color: #000000;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid rgba(255, 153, 221, 0.15);
            position: relative;
            z-index: 50;
        }

        /* TÍTULO DO CAPÍTULO */
        .capitulo-titulo-topo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            text-align: center;
            width: 100%;
            text-shadow: 0 0 12px var(--primary-pink);
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* CONTROLES DO TOPO */
        .leitor-controles {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
            gap: 12px;
        }

        /* BOTÃO VOLTAR ARREDONDADO */
        .btn-voltar-obra {
            background: #000000;
            color: #FF99DD;
            border: 2px solid var(--primary-pink);
            padding: 7px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(255, 153, 221, 0.3);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-transform: lowercase;
            white-space: nowrap;
        }
        .btn-voltar-obra:hover {
            background: rgba(255, 153, 221, 0.15);
            box-shadow: 0 0 15px rgba(255, 153, 221, 0.6);
        }

        /* LISTA DE CAPÍTULOS ARREDONDADA */
        .dropdown-container {
            position: relative;
            flex: 1;
            max-width: 230px;
        }
        .select-capitulos {
            width: 100%;
            background: #000000;
            border: 2px solid var(--primary-pink);
            color: #FF99DD;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 153, 221, 0.3);
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.364%22%20height%3D%22292.364%22%3E%3Cpath%20fill%3D%22%23FF99DD%22%20d%3D%22M287.934%20197.935L146.123%2056.127%204.31%20197.935c-3.28%203.28-3.28%208.6-0.003%2011.88l19.52%2019.52c3.28%203.28%208.6%203.28%2011.88%200l110.4-110.4%20110.4%20110.4c3.28%203.28%208.6%203.28%2011.88%200l19.52-19.52c3.28-3.28%203.28-8.6%200.002-11.88z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 8px;
            padding-right: 30px;
            text-align-last: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }
        .select-capitulos:hover {
            background: rgba(255, 153, 221, 0.15);
            box-shadow: 0 0 15px rgba(255, 153, 221, 0.6);
        }
        .select-capitulos option {
            background: #000000;
            color: #FF99DD;
            padding: 8px;
        }

        /* ÁREA DE LEITURA */
        .paginas-leitor {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            min-height: 70vh;
        }
        .pagina-manga {
            width: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        /* NAVEGAÇÃO DO FINAL DO CAPÍTULO */
        .navegacao-final {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin: 40px auto 20px auto;
            padding: 0 16px;
        }
        .btn-navegacao {
            background: #000000;
            color: #FF99DD;
            border: 2px solid var(--primary-pink);
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(255, 153, 221, 0.35);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-transform: lowercase;
            flex: 1;
            max-width: 220px;
            text-align: center;
        }
        .btn-navegacao:hover:not(.disabled) {
            background: rgba(255, 153, 221, 0.2);
            box-shadow: 0 0 18px rgba(255, 153, 221, 0.7);
            transform: translateY(-2px);
        }
        .btn-navegacao.disabled {
            border-color: rgba(255, 153, 221, 0.3);
            color: rgba(255, 153, 221, 0.3);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* BOTÃO FLUTUANTE DA FLOR */
        .btn-flor-topo {
            position: fixed;
            bottom: 20px;
            right: 4px;
            width: 42px;
            height: 42px;
            background: transparent;
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: none;
            z-index: 999;
            transition: transform 0.2s ease;
            text-decoration: none;
        }
        .btn-flor-topo:hover {
            transform: scale(1.15);
        }
        .btn-flor-topo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 6px rgba(255, 153, 221, 0.45));
        }
    </style>
</head>
<body>

    <!-- BARRA DE PROGRESSO -->
    <div class="barra-progresso-container">
        <div class="barra-progresso-fill" id="barraProgresso"></div>
    </div>

    <!-- TOPO DO LEITOR -->
    <div class="leitor-topo">
        <!-- TÍTULO DO CAPÍTULO -->
        <div class="capitulo-titulo-topo" id="textoCapituloReal">
            CAPÍTULO --
        </div>

        <!-- CONTROLES -->
        <div class="leitor-controles">
            <a href="#" class="btn-voltar-obra" id="btnVoltarObra">voltar</a>
            
            <div class="dropdown-container">
                <select class="select-capitulos" id="selectCapitulos" onchange="mudarCapitulo(this.value)">
                    <option value="" disabled selected>Lista de Capítulos</option>
                </select>
            </div>
        </div>
    </div>

    <!-- PÁGINAS DO CAPÍTULO -->
    <div class="paginas-leitor" id="paginasContainer">
        <p style="text-align: center; color: var(--primary-pink); padding: 80px 20px;">Carregando páginas do capítulo...</p>
    </div>

    <!-- BOTÕES DE NAVEGAÇÃO NO FINAL DO CAPÍTULO -->
    <div class="navegacao-final" id="navegacaoFinal" style="display: none;">
        <a href="#" id="btnAnterior" class="btn-navegacao disabled">‹ anterior</a>
        <a href="#" id="btnProximo" class="btn-navegacao disabled">próximo ›</a>
    </div>

    <!-- BOTÃO FLUTUANTE DA FLOR -->
    <a href="#" class="btn-flor-topo" onclick="voltarAoTopo(event)" title="Voltar ao topo">
        <img src="https://files.catbox.moe/fjfbc8.png" alt="Voltar ao Topo">
    </a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const obraSlugUrl = decodeURIComponent(urlParams.get('obra') || '').trim().toLowerCase();
        const capSlugUrl = decodeURIComponent(urlParams.get('cap') || '').trim().toLowerCase();

        let obraGlobal = null;

        function criarSlug(texto) {
            return String(texto || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^\w-]/g, '');
        }

        fetch('obras.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(obras => {
                obraGlobal = obras.find(o => criarSlug(o.titulo) === obraSlugUrl || String(o.id).trim().toLowerCase() === obraSlugUrl || String(o.titulo).trim().toLowerCase() === obraSlugUrl);

                if (!obraGlobal) {
                    document.getElementById('paginasContainer').innerHTML = `
                        <div style="text-align:center; padding: 60px 20px;">
                            <h2 style="color:var(--primary-pink);">Obra não encontrada!</h2>
                            <p style="color:var(--primary-pink); margin-top: 10px; opacity:0.8;">Não foi possível carregar os dados desta obra.</p>
                            <a href="./" class="btn-voltar-obra" style="display:inline-flex; margin-top:20px;">Voltar ao Início</a>
                        </div>
                    `;
                    return;
                }

                carregarLeitor();
            })
            .catch(err => {
                console.error("Erro ao carregar dados:", err);
                document.getElementById('paginasContainer').innerHTML = `<p style="color:#FF99DD; text-align:center; padding: 40px;">Erro ao carregar o capítulo.</p>`;
            });

        function carregarLeitor() {
            const slugObraId = obraGlobal.id || criarSlug(obraGlobal.titulo);
            
            // Corrige o link do botão voltar para a página de detalhes usando o identificador correto da obra
            const linkDetalhes = `detalhes.html?obra=${slugObraId}`;
            document.getElementById('btnVoltarObra').href = linkDetalhes;

            let capitulos = obraGlobal.capitulos || [];
            let indexAtual = -1;
            let capAtual = null;

            if (capSlugUrl) {
                indexAtual = capitulos.findIndex(c => {
                    let num = typeof c === 'object' ? c.numero : c;
                    return String(num).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-') === capSlugUrl;
                });
                if (indexAtual !== -1) {
                    capAtual = capitulos[indexAtual];
                }
            }

            if (!capAtual && capitulos.length > 0) {
                indexAtual = 0;
                capAtual = capitulos[0];
            }

            if (!capAtual) {
                document.getElementById('textoCapituloReal').textContent = `CAPÍTULO --`;
                document.getElementById('paginasContainer').innerHTML = `<p style="color: var(--primary-pink); text-align: center; padding: 50px;">Capítulo não encontrado.</p>`;
                return;
            }

            let numCap = typeof capAtual === 'object' ? capAtual.numero : capAtual;
            document.getElementById('textoCapituloReal').textContent = `CAPÍTULO ${numCap}`;
            document.title = `Capítulo ${numCap} - ${obraGlobal.titulo} - Flower's Nenascan 🌸`;

            // Configurar lista de capítulos mantendo estritamente "Lista de Capítulos" no topo
            const selectEl = document.getElementById('selectCapitulos');
            selectEl.innerHTML = `<option value="" disabled selected>Lista de Capítulos</option>`;
            
            capitulos.forEach((c) => {
                let num = typeof c === 'object' ? c.numero : c;
                let slugC = String(num).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                selectEl.innerHTML += `<option value="${slugC}">Capítulo ${num}</option>`;
            });

            let paginas = [];
            if (typeof capAtual === 'object' && Array.isArray(capAtual.paginas)) {
                paginas = capAtual.paginas;
            }

            const containerPaginas = document.getElementById('paginasContainer');
            if (paginas.length > 0) {
                containerPaginas.innerHTML = paginas.map(img => `<img src="${img}" alt="Página do capítulo" class="pagina-manga" loading="lazy">`).join('');
            } else {
                containerPaginas.innerHTML = `<p style="color: var(--primary-pink); text-align: center; padding: 60px;">Nenhuma imagem cadastrada para este capítulo.</p>`;
            }

            // Configurar botões de Anterior e Próximo no final do capítulo
            const navFinal = document.getElementById('navegacaoFinal');
            const btnAnterior = document.getElementById('btnAnterior');
            const btnProximo = document.getElementById('btnProximo');
            navFinal.style.display = 'flex';

            if (indexAtual > 0) {
                let capAnt = capitulos[indexAtual - 1];
                let numAnt = typeof capAnt === 'object' ? capAnt.numero : capAnt;
                let slugAnt = String(numAnt).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                btnAnterior.href = `ler.html?obra=${slugObraId}&cap=${slugAnt}`;
                btnAnterior.classList.remove('disabled');
            } else {
                btnAnterior.href = '#';
                btnAnterior.classList.add('disabled');
            }

            if (indexAtual < capitulos.length - 1 && indexAtual !== -1) {
                let capProx = capitulos[indexAtual + 1];
                let numProx = typeof capProx === 'object' ? capProx.numero : capProx;
                let slugProx = String(numProx).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                btnProximo.href = `ler.html?obra=${slugObraId}&cap=${slugProx}`;
                btnProximo.classList.remove('disabled');
            } else {
                btnProximo.href = '#';
                btnProximo.classList.add('disabled');
            }
        }

        function mudarCapitulo(slugCap) {
            if (!slugCap || !obraGlobal) return;
            const slugObraId = obraGlobal.id || criarSlug(obraGlobal.titulo);
            window.location.href = `ler.html?obra=${slugObraId}&cap=${slugCap}`;
        }

        function voltarAoTopo(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const alturaTotal = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            if (alturaTotal > 0) {
                const progresso = (scrollTop / alturaTotal) * 100;
                document.getElementById('barraProgresso').style.width = `${progresso}%`;
            }
        });
    </script>
</body>
</html>
