<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - Flower's Nenasscan</title>
    <style>
        body { 
            background: #111; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .leitor-container { 
            width: 100%; 
            max-width: 800px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .leitor-container img { 
            width: 100%; 
            height: auto; 
            display: block; 
            margin: 0; 
            padding: 0; 
        }
        .voltar { 
            position: fixed; 
            top: 10px; 
            left: 10px; 
            background: #ff69b4; 
            color: white; 
            padding: 10px 15px; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
            z-index: 100; 
        }
        .erro { 
            margin-top: 100px; 
            text-align: center; 
            color: #ffb6c1; 
            padding: 20px; 
        }
    </style>
</head>
<body>
    <a href="index.html" class="voltar">← Voltar</a>
    <div class="leitor-container" id="painel-imagens"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const obraId = urlParams.get('obra');
        const capNum = urlParams.get('cap');
        const container = document.getElementById('painel-imagens');

        async function carregarLeitor() {
            if (!obraId || !capNum) {
                container.innerHTML = '<h2 class="erro">Erro: Obra ou capítulo não encontrados.</h2>';
                return;
            }

            try {
                const resposta = await fetch('obras.json?v=' + new Date().getTime());
                const obras = await resposta.json();

                const obra = obras.find(o => o.id === obraId);
                if (!obra) {
                    container.innerHTML = '<h2 class="erro">Obra não encontrada!</h2>';
                    return;
                }

                // Acha o capítulo correspondente no JSON pelo número
                const capitulo = obra.capitulos.find(c => c.numero === decodeURIComponent(capNum));
                
                if (!capitulo) {
                    container.innerHTML = '<h2 class="erro">Capítulo não encontrado no sistema!</h2>';
                    return;
                }

                // Pega o link ou a lista de links do Catbox definidos no JSON
                const dadosLink = capitulo.link || capitulo.paginas;

                if (!dadosLink) {
                    container.innerHTML = '<h2 class="erro">Este capítulo ainda não possui páginas cadastradas!</h2>';
                    return;
                }

                container.innerHTML = '';

                // Se for um array de links do Catbox
                if (Array.isArray(dadosLink)) {
                    dadosLink.forEach((urlImg, index) => {
                        let img = document.createElement('img');
                        img.src = urlImg;
                        img.alt = `Página ${index + 1}`;
                        container.appendChild(img);
                    });
                } 
                // Se for apenas uma string (um único link do Catbox ou uma imagem só)
                else if (typeof dadosLink === 'string') {
                    let img = document.createElement('img');
                    img.src = dadosLink;
                    img.alt = "Página do Capítulo";
                    container.appendChild(img);
                }

            } catch (erro) {
                console.error(erro);
                container.innerHTML = '<h2 class="erro">Erro ao carregar os dados do capítulo.</h2>';
            }
        }

        carregarLeitor();
    </script>
</body>
</html>
