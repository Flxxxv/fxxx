<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Flower's Nenascan 🌸 - Leitor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #netlify-badge, div[id*="netlify-badge"] { display: none !important; }
        :root {
            --bg-color: #000000;
            --primary-pink: #FF99DD; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--primary-pink); padding-bottom: 40px; overflow-x: hidden; }

        /* BARRA DE PROGRESSO ROSA EM BAIXO */
        .barra-progresso-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 153, 221, 0.2);
            z-index: 1000;
        }
        .barra-progresso-fill {
            width: 0%;
            height: 100%;
            background: #FF99DD;
            box-shadow: 0 0 12px #FF99DD;
            transition: width 0.1s linear;
        }

        /* TOPO DO LEITOR */
        .leitor-topo {
            background-color: #000000;
            padding: 12px 16px 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid rgba(255, 153, 221, 0.2);
            position: relative;
            z-index: 50;
        }

        .caminho-breadcrumb {
            font-size: 0.8rem;
            color: var(--primary-pink);
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        .caminho-breadcrumb a { color: var(--primary-pink); text-decoration: none; }
        .caminho-breadcrumb a:hover { text-decoration: underline; }

        /* TÍTULO DA OBRA COM A FLORZINHA CORRETA */
        .obra-titulo-topo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary-pink);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            text-align: center;
            width: 100%;
        }
        .icone-flor {
            width: 22px;
            height: 22px;
            fill: #FF99DD;
            filter: drop-shadow(0 0 5px rgba(255, 153, 221, 0.8));
            flex-shrink: 0;
        }

        /* TÍTULO DO CAPÍTULO CENTRALIZADO */
        .capitulo-titulo-topo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-pink);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
            text-align: center;
        }

        /* CONTROLES: BOTÕES EM PÍLULA ROSA NA MESMA LINHA */
        .leitor-controles {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 12px;
        }

        /* BOTÃO VOLTAR ROSA */
        .btn-voltar-obra {
            background: #FF99DD;
            color: #0b0b0e;
            border: none;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(255, 153, 221, 0.6);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-transform: lowercase;
            white-space: nowrap;
        }
        .btn-voltar-obra:hover {
            background: #ff77d5;
            transform: scale(1.02);
        }

        /* BOTÃO LISTA DE CAPÍTULOS */
        .dropdown-container {
            position: relative;
            flex: 1;
            max-width: 240px;
        }
        .select-capitulos {
            width: 100%;
            background: #FF99DD;
            border: none;
            color: #0b0b0e;
            padding: 10px 16px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 12px rgba(255, 153, 221, 0.6);
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.364%22%20height%3D%22292.364%22%3E%3Cpath%20fill%3D%22%230b0b0e%22%20d%3D%22M287.934%20197.935L146.123%2056.127%204.31%20197.935c-3.28%203.28-3.28%208.6-0.003%2011.88l19.52%2019.52c3.28%203.28%208.6%203.28%2011.88%200l110.4-110.4%20110.4%20110.4c3.28%203.28%208.6%203.28%2011.88%200l19.52-19.52c3.28-3.28%203.28-8.6%200.002-11.88z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 9px;
            padding-right: 32px;
            text-align-last: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .select-capitulos option {
            background: #14141a;
            color: #FF99DD;
        }

        /* ÁREA DE LEITURA */
        .paginas-leitor {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            min-height: 70vh;
        }
        .pagina-manga {
            width: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        /* BOTÃO DE FLOR FLUTUANTE PERFEITO NO CANTO INFERIOR DIREITO */
        .btn-flor-topo {
            position: fixed;
            bottom: 25px;
            right: 20px;
            width: 58px;
            height: 58px;
            background: #FF99DD;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 153, 221, 0.8);
            z-index: 999;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn-flor-topo:hover {
            transform: scale(1.1);
            background: #ff77d5;
        }
        .btn-flor-topo svg {
            width: 32px;
            height: 32px;
            fill: #0b0b0e;
        }
    </style>
</head>
<body>

    <!-- BARRA DE PROGRESSO -->
    <div class="barra-progresso-container">
        <div class="barra-progresso-fill" id="barraProgresso"></div>
    </div>

    <!-- TOPO DO LEITOR -->
    <div class="leitor-topo">
        <div class="caminho-breadcrumb" id="breadcrumb">
            <a href="./">Início</a> / <a href="#" id="linkBreadcrumbObra">Obras</a> / <span id="nomeObraBreadcrumb">Carregando...</span>
        </div>

        <!-- TÍTULO DA OBRA COM FLOR -->
        <div class="obra-titulo-topo" id="tituloObraTopo">
            <svg class="icone-flor" viewBox="0 0 24 24">
                <path d="M12,2C10.5,2 9,2.8 8,4C7,2.8 5.5,2 4,2C1.5,2 0,4 0,6.5C0,9 2,11 5,12C2,13 0,15 0,17.5C0,20 1.5,22 4,22C5.5,22 7,21.2 8,20C9,21.2 10.5,22 12,22C13.5,22 15,21.2 16,20C17,21.2 18.5,22 20,22C22.5,22 24,20 24,17.5C24,15 22,13 19,12C22,11 24,9 24,6.5C24,4 22.5,2 20,2C18.5,2 17,2.8 16,4C15,2.8 13.5,2 12,2Z"/>
            </svg>
            <span id="textoTituloObra">NOME DA OBRA</span>
        </div>

        <!-- TÍTULO DO CAPÍTULO -->
        <div class="capitulo-titulo-topo" id="tituloCapituloTopo">
            CAPÍTULO --
        </div>

        <!-- CONTROLES -->
        <div class="leitor-controles">
            <a href="#" class="btn-voltar-obra" id="btnVoltarObra">voltar</a>
            
            <div class="dropdown-container">
                <select class="select-capitulos" id="selectCapitulos" onchange="mudarCapitulo(this.value)">
                    <option value="">≡ Lista de Capítulos ∨</option>
                </select>
            </div>
        </div>
    </div>

    <!-- PÁGINAS DO CAPÍTULO -->
    <div class="paginas-leitor" id="paginasContainer">
        <p style="text-align: center; color: var(--primary-pink); padding: 80px 20px;">Carregando páginas do capítulo...</p>
    </div>

    <!-- BOTÃO FLUTUANTE DE FLOR COM SETINHA PARA CIMA -->
    <a href="#" class="btn-flor-topo" onclick="voltarAoTopo(event)" title="Voltar ao topo">
        <svg viewBox="0 0 24 24">
            <!-- Formato de flor com seta para cima -->
            <path d="M12,2C10.5,2 9,2.8 8,4C7,2.8 5.5,2 4,2C1.5,2 0,4 0,6.5C0,9 2,11 5,12C2,13 0,15 0,17.5C0,20 1.5,22 4,22C5.5,22 7,21.2 8,20C9,21.2 10.5,22 12,22C13.5,22 15,21.2 16,20C17,21.2 18.5,22 20,22C22.5,22 24,20 24,17.5C24,15 22,13 19,12C22,11 24,9 24,6.5C24,4 22.5,2 20,2C18.5,2 17,2.8 16,4C15,2.8 13.5,2 12,2ZM12,8L17,13H14V17H10V13H7L12,8Z"/>
        </svg>
    </a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const obraSlugUrl = decodeURIComponent(urlParams.get('obra') || '').trim().toLowerCase();
        const capSlugUrl = decodeURIComponent(urlParams.get('cap') || '').trim().toLowerCase();

        let obraGlobal = null;

        function criarSlug(texto) {
            return String(texto || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^\w-]/g, '');
        }

        fetch('obras.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(obras => {
                obraGlobal = obras.find(o => criarSlug(o.titulo) === obraSlugUrl || String(o.id).trim().toLowerCase() === obraSlugUrl || String(o.titulo).trim().toLowerCase() === obraSlugUrl);

                if (!obraGlobal) {
                    document.getElementById('paginasContainer').innerHTML = `
                        <div style="text-align:center; padding: 60px 20px;">
                            <h2 style="color:var(--primary-pink);">Obra não encontrada!</h2>
                            <p style="color:var(--primary-pink); margin-top: 10px; opacity:0.8;">Não foi possível carregar os dados desta obra.</p>
                            <a href="./" class="btn-voltar-obra" style="display:inline-flex; margin-top:20px;">Voltar ao Início</a>
                        </div>
                    `;
                    return;
                }

                carregarLeitor();
            })
            .catch(err => {
                console.error("Erro ao carregar dados:", err);
                document.getElementById('paginasContainer').innerHTML = `<p style="color:#FF99DD; text-align:center; padding: 40px;">Erro ao carregar o capítulo.</p>`;
            });

        function carregarLeitor() {
            const slugObraId = obraGlobal.id || criarSlug(obraGlobal.titulo);
            
            const linkDetalhes = `detalhes.html?nome=${slugObraId}`;
            document.getElementById('btnVoltarObra').href = linkDetalhes;
            document.getElementById('linkBreadcrumbObra').href = linkDetalhes;
            document.getElementById('nomeObraBreadcrumb').textContent = obraGlobal.titulo;
            document.getElementById('textoTituloObra').textContent = obraGlobal.titulo;

            let capitulos = obraGlobal.capitulos || [];
            let capAtual = null;

            if (capSlugUrl) {
                capAtual = capitulos.find(c => {
                    let num = typeof c === 'object' ? c.numero : c;
                    return String(num).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-') === capSlugUrl;
                });
            }

            if (!capAtual && capitulos.length > 0) {
                capAtual = capitulos[0];
            }

            if (!capAtual) {
                document.getElementById('tituloCapituloTopo').textContent = `CAPÍTULO --`;
                document.getElementById('paginasContainer').innerHTML = `<p style="color: var(--primary-pink); text-align: center; padding: 50px;">Capítulo não encontrado.</p>`;
                return;
            }

            let numCap = typeof capAtual === 'object' ? capAtual.numero : capAtual;
            document.getElementById('tituloCapituloTopo').textContent = `CAPÍTULO ${numCap}`;
            document.title = `Capítulo ${numCap} - ${obraGlobal.titulo} - Flower's Nenascan 🌸`;

            const selectEl = document.getElementById('selectCapitulos');
            selectEl.innerHTML = `<option value="">≡ Lista de Capítulos ∨</option>`;
            
            capitulos.forEach(c => {
                let num = typeof c === 'object' ? c.numero : c;
                let slugC = String(num).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                let selecionado = String(num).toLowerCase() === String(numCap).toLowerCase() ? 'selected' : '';
                selectEl.innerHTML += `<option value="${slugC}" ${selecionado}>Capítulo ${num}</option>`;
            });

            let paginas = [];
            if (typeof capAtual === 'object' && Array.isArray(capAtual.paginas)) {
                paginas = capAtual.paginas;
            }

            const containerPaginas = document.getElementById('paginasContainer');
            if (paginas.length > 0) {
                containerPaginas.innerHTML = paginas.map(img => `<img src="${img}" alt="Página do capítulo" class="pagina-manga" loading="lazy">`).join('');
            } else {
                containerPaginas.innerHTML = `<p style="color: var(--primary-pink); text-align: center; padding: 60px;">Nenhuma imagem cadastrada para este capítulo.</p>`;
            }
        }

        function mudarCapitulo(slugCap) {
            if (!slugCap || !obraGlobal) return;
            const slugObraId = obraGlobal.id || criarSlug(obraGlobal.titulo);
            window.location.href = `ler.html?obra=${slugObraId}&cap=${slugCap}`;
        }

        function voltarAoTopo(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const alturaTotal = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            if (alturaTotal > 0) {
                const progresso = (scrollTop / alturaTotal) * 100;
                document.getElementById('barraProgresso').style.width = `${progresso}%`;
            }
        });
    </script>
</body>
</html>
