<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura - Flowers Nenascan 🌸</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .topo-leitor {
            width: 100%;
            background-color: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff69b4;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .topo-leitor a {
            color: #ffb6c1;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .topo-leitor a:hover {
            color: #ff1493;
        }

        .titulo-capitulo {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .leitor-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 80vh;
            padding: 20px 0;
        }

        .leitor-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            object-fit: contain;
        }

        .mensagem-erro {
            margin-top: 50px;
            text-align: center;
            padding: 20px;
            color: #ffb6c1;
        }
    </style>
</head>
<body>

    <div class="topo-leitor">
        <a href="index.html">← Voltar ao Início</a>
        <div id="info-topo" class="titulo-capitulo">Carregando capítulo...</div>
        <a href="index.html">Início 🌸</a>
    </div>

    <div class="leitor-container" id="painel-imagens">
        <p class="mensagem-erro">Preparando as páginas para você...</p>
    </div>

    <script>
        // Pega os dados que vieram no link (ex: ?obra=meu-vizinho&cap=1)
        const urlParams = new URLSearchParams(window.location.search);
        const nomeObra = urlParams.get('obra');
        const numCap = urlParams.get('cap');

        const painelImagens = document.getElementById('painel-imagens');
        const infoTopo = document.getElementById('info-topo');

        if (!nomeObra || !numCap) {
            painelImagens.innerHTML = '<div class="mensagem-erro"><h2>Ops!</h2><p>Capítulo ou obra não encontrados no link.</p></div>';
            infoTopo.innerText = "Erro";
        } else {
            infoTopo.innerText = `Obra: ${nomeObra} | Cap ${numCap}`;
            
            // Aqui o leitor vai tentar carregar as imagens sequenciais da pasta
            // Exemplo: nome-da-obra/cap-1/1.jpg, 2.jpg, 3.jpg ... até a imagem falhar (fim do capítulo)
            painelImagens.innerHTML = '';
            
            let paginaAtual = 1;
            let imagensCarregadas = 0;

            function carregarProximaPagina() {
                const img = new Image();
                // Caminho da pasta: nomeObra / cap-numCap / paginaAtual.jpg
                img.src = `${nomeObra}/cap-${numCap}/${paginaAtual}.jpg`;
                img.alt = `Página ${paginaAtual}`;

                img.onload = function() {
                    painelImagens.appendChild(img);
                    imagensCarregadas++;
                    paginaAtual++;
                    carregarProximaPagina(); // Tenta carregar a próxima
                };

                img.onerror = function() {
                    if (imagensCarregadas === 0) {
                        painelImagens.innerHTML = `
                            <div class="mensagem-erro">
                                <h2>Ainda não há páginas aqui! 🌸</h2>
                                <p>Não encontramos imagens na pasta: <code>${nomeObra}/cap-${numCap}/</code></p>
                                <p style="font-size: 0.85rem; color: #aaa; margin-top: 10px;">Certifique-se de que a pasta existe e a primeira imagem se chama <strong>1.jpg</strong>.</p>
                            </div>`;
                    }
                };
            }

            carregarProximaPagina();
        }
    </script>
</body>
</html>
