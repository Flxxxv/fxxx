<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - Flower's Nenasscan</title>
    <style>
        body { background: #111; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .leitor-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        .leitor-container img { width: 100%; height: auto; display: block; margin: 0; padding: 0; }
        .voltar { position: fixed; top: 10px; left: 10px; background: #ff69b4; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; z-index: 100; }
    </style>
</head>
<body>
    <a href="index.html" class="voltar">← Voltar</a>
    <div class="leitor-container" id="painel-imagens"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const obra = urlParams.get('obra');
        const cap = urlParams.get('cap');
        const container = document.getElementById('painel-imagens');

        if (obra && cap) {
            // Como tu sabes que o cap-1 tem de 1 até 9 imagens (ou mais), ele vai buscar automaticamente
            for (let i = 1; i <= 50; i++) {
                let img = document.createElement('img');
                let caminho = `${obra}/cap-${cap}/${i}.jpg`;
                img.src = caminho;
                
                // Se a imagem não existir (passou do limite do capítulo), ela some para não quebrar a tela
                img.onerror = function() {
                    this.remove();
                };
                
                container.appendChild(img);
            }
        } else {
            container.innerHTML = '<h2>Erro: Obra ou capítulo não encontrados.</h2>';
        }
    </script>
</body>
</html>
