<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers Nenascan 🌸</title>
    <style>
        :root {
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --primary-pink: #ffb6c1;
            --dark-pink: #ff69b4;
            --accent-color: #ff1493;
            --text-main: #4a3b42;
            --text-muted: #8c7b82;
            --shadow: 0 4px 15px rgba(255, 105, 180, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Topo / Header */
        header {
            background-color: var(--card-bg);
            border-bottom: 3px solid var(--primary-pink);
            padding: 25px 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Menu de Navegação */
        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            background-color: var(--primary-pink);
            padding: 12px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            background-color: rgba(255, 255, 255, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            background-color: white;
            color: var(--accent-color);
        }

        /* Layout Principal em Grid (Estilo 3xyaoi) */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            color: var(--dark-pink);
            border-bottom: 2px dashed var(--primary-pink);
            padding-bottom: 8px;
            margin-bottom: 25px;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }

        .manga-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 2px solid #ffe4e9;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .manga-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-pink);
        }

        .manga-capa {
            width: 100%;
            height: 280px;
            background-color: #ffd1dc;
            object-fit: cover;
            display: block;
        }

        .manga-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .manga-info h3 {
            color: var(--accent-color);
            font-size: 1rem;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .manga-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .btn-capitulo {
            display: block;
            text-align: center;
            background-color: var(--dark-pink);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .btn-capitulo:hover {
            background-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 Flowers Nenascan</h1>
        <p>Traduções de Manhwas com muito amor e carinho 💖</p>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Romance</a>
        <a href="#">Stalker</a>
        <a href="#">Drama</a>
        <a href="#">Projetos</a>
    </nav>

    <div class="container">
        <h2 class="section-title">✨ Últimos Lançamentos</h2>

        <div class="manga-grid">
            <!-- Card 1 -->
            <div class="manga-card">
                <!-- Insira o link da imagem da capa no src abaixo -->
                <img src="https://via.placeholder.com/210x280/ffb6c1/ffffff?text=Capa" alt="Capa da Obra" class="manga-capa">
                <div class="manga-info">
                    <div>
                        <h3>Meu vizinho está sempre me observando</h3>
                        <p>Capítulo 01</p>
                    </div>
                    <a href="#" class="btn-capitulo">Ler Capítulo</a>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="manga-card">
                <img src="https://via.placeholder.com/210x280/ffb6c1/ffffff?text=Capa" alt="Capa da Obra" class="manga-capa">
                <div class="manga-info">
                    <div>
                        <h3>O amor chega numa noite de luar</h3>
                        <p>Capítulo 05</p>
                    </div>
                    <a href="#" class="btn-capitulo">Ler Capítulo</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
